[package]
name = "aneditor"
version = "0.1.3"
description = "AI-native lightweight text editor"
authors = ["aneditor contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aneditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "0.1"
notify = "8.2.0"
regex = "1.13.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
