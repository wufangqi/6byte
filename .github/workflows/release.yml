name: Release

# Triggered by pushing a version tag (v0.1.8, v0.2.0-rc1, ...) or manually with
# a tag that already exists. Builds the Windows, Linux and macOS installers and
# attaches them to one GitHub Release. Tag pushes create a draft so the assets
# can be checked before publishing; a manual run with `publish: true` publishes
# directly after every platform has uploaded.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.8)"
        required: true
      publish:
        description: "Publish the release immediately instead of leaving a draft"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Create the draft release once. A matrix that each calls tauri-action would
  # otherwise race to create the same release.
  prepare:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify version matches the tag
        run: node scripts/check-version.mjs "${{ inputs.tag || github.ref_name }}"

      - name: Generate release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${{ inputs.tag || github.ref_name }}" "$RUNNER_TEMP/release-notes.md"

      - name: Create the draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          release_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1
          }
          ID=$(release_id)
          if [ -z "$ID" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "6byte $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            ID=$(release_id)
          fi
          if [ -z "$ID" ]; then
            echo "could not find or create a release for $TAG" >&2
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "release id: $ID"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows installers
            args: "--bundles nsis,msi"
          - os: ubuntu-22.04
            name: Linux packages
            args: "--bundles deb,appimage"
          - os: macos-latest
            name: macOS universal DMG
            args: "--target universal-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets for a universal build
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and attach ${{ matrix.name }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: ${{ inputs.tag || github.ref_name }}
          args: ${{ matrix.args }}

      - name: Keep bundles for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish release
    needs: [prepare, build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove the draft flag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest

  summary:
    name: Release summary
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Show assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          {
            echo "### 6byte $TAG"
            echo ""
            echo "| OS | Bundles |"
            echo "|---|---|"
            echo "| Windows | NSIS + MSI |"
            echo "| Linux | deb + AppImage |"
            echo "| macOS | universal DMG |"
            echo ""
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' || true
          } >> "$GITHUB_STEP_SUMMARY"
