name: 缺陷
description: 结果和预期不一致
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: 发生了什么
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期是什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: "0.1.7"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
